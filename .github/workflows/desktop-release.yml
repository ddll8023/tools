name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            package_args: --mac
            artifact_name: toolbox-macos-arm64
          - name: Windows x64
            runner: windows-latest
            package_args: --win
            artifact_name: toolbox-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Verify macOS native build tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in autoconf automake libtool pkg-config make cc; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "缺少构建工具: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "运行镜像缺少 USB 原生依赖构建工具；本工作流不自动安装，请先补齐。"
            exit 1
          fi

      - name: Install backend dependencies (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uv sync --directory backend --frozen
          uv pip install --python backend/.venv/bin/python 'pyinstaller==6.20.0'

      - name: Install backend dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv sync --directory backend --frozen
          uv pip install --python backend/.venv/Scripts/python.exe 'pyinstaller==6.20.0'

      - name: Build desktop runtime
        run: |
          npm run build:frontend
          npm run compile:electron
          npm run build:backend

      - name: Stage USB native sources (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp build/usb-native/dist/usb-sources.tar.gz release/
          cp build/usb-native/dist/build-info.json release/usb-build-info.json

      - name: Package portable zip
        run: node scripts/package-portable.mjs ${{ matrix.package_args }}

      - name: Generate checksums (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          output="release/SHA256SUMS-${{ matrix.artifact_name }}.txt"
          for file in release/*; do
            [ -f "$file" ] || continue
            [ "$file" = "$output" ] && continue
            shasum -a 256 "$file"
          done > "$output"

      - name: Generate checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = "release/SHA256SUMS-${{ matrix.artifact_name }}.txt"
          Get-ChildItem release -File |
            Where-Object { $_.Name -notlike 'SHA256SUMS-*' } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content $output

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.zip
            release/usb-sources.tar.gz
            release/usb-build-info.json
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14
