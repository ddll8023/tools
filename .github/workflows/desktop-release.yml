name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            electron_args: --mac --arm64
            artifact_name: toolbox-macos-arm64
          - name: Windows x64
            runner: windows-latest
            electron_args: --win --x64
            artifact_name: toolbox-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Install backend dependencies (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uv sync --directory backend --frozen
          uv pip install --python backend/.venv/bin/python 'pyinstaller<7'

      - name: Install backend dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv sync --directory backend --frozen
          uv pip install --python backend/.venv/Scripts/python.exe 'pyinstaller<7'

      - name: Build desktop runtime
        run: |
          npm run build:frontend
          npm run compile:electron
          npm run build:backend

      - name: Package installer
        run: npx electron-builder ${{ matrix.electron_args }} --publish never

      - name: Generate checksums (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for file in release/*; do
            if [ -f "$file" ]; then
              shasum -a 256 "$file"
            fi
          done > "release/SHA256SUMS-${{ matrix.artifact_name }}.txt"

      - name: Generate checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem release -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content "release/SHA256SUMS-${{ matrix.artifact_name }}.txt"

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: toolbox-*
          path: downloaded
          merge-multiple: false

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find downloaded/toolbox-macos-arm64 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.yml' -o -name '*.blockmap' -o -name 'SHA256SUMS-*.txt' \) \
            -exec cp {} release/ \;
          find downloaded/toolbox-windows-x64 -type f \
            \( -name '*.exe' -o -name '*.zip' -o -name '*.yml' -o -name '*.blockmap' -o -name 'SHA256SUMS-*.txt' \) \
            -exec cp {} release/ \;
          test -f release/latest-mac.yml
          test -f release/latest.yml
          ls -lah release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
